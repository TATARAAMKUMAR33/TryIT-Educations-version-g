name: TryIT Question Generator

on:
  schedule:
    - cron: '0 * * * *' # Runs exactly every 1 hour
  workflow_dispatch: # Manual trigger

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 55 # Prevents overlap with the next hourly run
    concurrency:
      group: tryit-pipeline
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests

      - name: Create .env from secrets
        run: |
          cat > .env << 'ENVEOF'
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}
          NVIDIA_API_KEY_1=${{ secrets.NVIDIA_API_KEY_1 }}
          NVIDIA_API_KEY_2=${{ secrets.NVIDIA_API_KEY_2 }}
          NVIDIA_API_KEY_3=${{ secrets.NVIDIA_API_KEY_3 }}
          NVIDIA_API_KEY_4=${{ secrets.NVIDIA_API_KEY_4 }}
          NVIDIA_API_KEY_5=${{ secrets.NVIDIA_API_KEY_5 }}
          GROQ_API_KEY_1=${{ secrets.GROQ_API_KEY_1 }}
          GROQ_API_KEY_2=${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3=${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4=${{ secrets.GROQ_API_KEY_4 }}
          GROQ_API_KEY_5=${{ secrets.GROQ_API_KEY_5 }}
          GEMINI_API_KEY_1=${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2=${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3=${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4=${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5=${{ secrets.GEMINI_API_KEY_5 }}
          SAMBANOVA_API_KEY_1=${{ secrets.SAMBANOVA_API_KEY_1 }}
          SAMBANOVA_API_KEY_2=${{ secrets.SAMBANOVA_API_KEY_2 }}
          SAMBANOVA_API_KEY_3=${{ secrets.SAMBANOVA_API_KEY_3 }}
          SAMBANOVA_API_KEY_4=${{ secrets.SAMBANOVA_API_KEY_4 }}
          SAMBANOVA_API_KEY_5=${{ secrets.SAMBANOVA_API_KEY_5 }}
          MISTRAL_API_KEY_1=${{ secrets.MISTRAL_API_KEY_1 }}
          MISTRAL_API_KEY_2=${{ secrets.MISTRAL_API_KEY_2 }}
          MISTRAL_API_KEY_3=${{ secrets.MISTRAL_API_KEY_3 }}
          OPENAI_API_KEY_1=${{ secrets.OPENAI_API_KEY_1 }}
          OPENAI_API_KEY_2=${{ secrets.OPENAI_API_KEY_2 }}
          OPENAI_API_KEY_3=${{ secrets.OPENAI_API_KEY_3 }}
          GH_MODELS_TOKEN_1=${{ secrets.GH_MODELS_TOKEN_1 }}
          GH_MODELS_TOKEN_2=${{ secrets.GH_MODELS_TOKEN_2 }}
          GH_MODELS_TOKEN_3=${{ secrets.GH_MODELS_TOKEN_3 }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=8486774321
          ENVEOF

      - name: Run generator
        id: gen
        run: python3 -u generate_master.py
        continue-on-error: true # If it fails, still send Telegram
        env:
          PYTHONUNBUFFERED: "1"

      - name: Send Hourly Telegram Report
        if: always()
        run: |
          python3 -c "
          import os, requests
          from collections import Counter, defaultdict
          from datetime import datetime, timezone
          
          u = os.getenv('SUPABASE_URL')
          k = os.getenv('SUPABASE_KEY')
          tg_token = os.getenv('TELEGRAM_BOT_TOKEN')
          tg_chat = os.getenv('TELEGRAM_CHAT_ID')
          
          h = {'apikey': k, 'Authorization': f'Bearer {k}'}
          today = datetime.now(timezone.utc).strftime('%Y-%m-%d')
          
          total = requests.get(f'{u}/rest/v1/questions?select=id', headers={**h, 'Prefer':'count=exact', 'Range':'0-0'}).headers.get('content-range').split('/')[-1]
          v3_total = requests.get(f'{u}/rest/v1/questions?select=id&generated_by=eq.tryit_v3', headers={**h, 'Prefer':'count=exact', 'Range':'0-0'}).headers.get('content-range').split('/')[-1]
          v3_today = requests.get(f'{u}/rest/v1/questions?select=id&generated_by=eq.tryit_v3&created_at=gte.{today}', headers={**h, 'Prefer':'count=exact', 'Range':'0-0'}).headers.get('content-range').split('/')[-1]
          
          all_rows = []
          offset = 0
          while True:
              r = requests.get(f'{u}/rest/v1/questions?select=subject_id,topic_id&limit=1000&offset={offset}', headers=h).json()
              if not r: break
              all_rows.extend(r)
              if len(r) < 1000: break
              offset += 1000
          
          subject_map = defaultdict(Counter)
          for row in all_rows:
              subj = row.get('subject_id') or 'unknown'
              top = row.get('topic_id') or 'unknown'
              subject_map[subj][top] += 1
          
          header = f'📊 <b>TRYIT HOURLY REPORT</b>\n\n'
          header += f'📚 <b>Total Questions:</b> {total}\n'
          header += f'✅ <b>Total Verified:</b> {v3_total}\n'
          header += f'🚀 <b>Generated Today:</b> {v3_today}\n\n'
          
          lines = [header]
          current_chunk = header
          for subj, topics in sorted(subject_map.items()):
              subj_total = sum(topics.values())
              block = f'\n📂 <b>{subj.replace(\"_\", \" \").title()}</b> ({subj_total} Qs)\n'
              for top, count in sorted(topics.items(), key=lambda x: -x[1]):
                  block += f'  • <code>{top}</code>: {count} Qs\n'
              
              if len(current_chunk) + len(block) > 4000:
                  lines.append(current_chunk)
                  current_chunk = block
              else:
                  current_chunk += block
          
          if current_chunk:
              lines.append(current_chunk)
          
          for chunk in lines:
              requests.post(f'https://api.telegram.org/bot{tg_token}/sendMessage', json={'chat_id': tg_chat, 'text': chunk, 'parse_mode': 'HTML'})
          print('Telegram Report Sent!')
          "
