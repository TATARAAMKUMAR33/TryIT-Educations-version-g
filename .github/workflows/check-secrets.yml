name: Check API Keys

on:
  workflow_dispatch:

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Verify which API keys are set
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          echo "🔍 Checking GitHub Secrets..."
          if [ -n "$OPENAI_API_KEY" ]; then echo "✅ OPENAI_API_KEY is SET"; else echo "❌ OPENAI_API_KEY is missing"; fi
          if [ -n "$GEMINI_API_KEY" ]; then echo "✅ GEMINI_API_KEY is SET"; else echo "❌ GEMINI_API_KEY is missing"; fi
          if [ -n "$ANTHROPIC_API_KEY" ]; then echo "✅ ANTHROPIC_API_KEY is SET"; else echo "❌ ANTHROPIC_API_KEY is missing"; fi
          if [ -n "$GROQ_API_KEY" ]; then echo "✅ GROQ_API_KEY is SET"; else echo "❌ GROQ_API_KEY is missing"; fi
          if [ -n "$TOGETHER_API_KEY" ]; then echo "✅ TOGETHER_API_KEY is SET"; else echo "❌ TOGETHER_API_KEY is missing"; fi
          if [ -n "$DEEPSEEK_API_KEY" ]; then echo "✅ DEEPSEEK_API_KEY is SET"; else echo "❌ DEEPSEEK_API_KEY is missing"; fi
          if [ -n "$MISTRAL_API_KEY" ]; then echo "✅ MISTRAL_API_KEY is SET"; else echo "❌ MISTRAL_API_KEY is missing"; fi
