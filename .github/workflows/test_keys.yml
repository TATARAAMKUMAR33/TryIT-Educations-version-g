name: Test All Keys

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install openai google-genai

      - name: Create .env from secrets
        run: |
          cat > .env << ENVEOF
          GROQ_API_KEY_1=${{ secrets.GROQ_API_KEY_1 }}
          NVIDIA_API_KEY_1=${{ secrets.NVIDIA_API_KEY_1 }}
          SAMBANOVA_API_KEY_1=${{ secrets.SAMBANOVA_API_KEY_1 }}
          GEMINI_API_KEY_1=${{ secrets.GEMINI_API_KEY_1 }}
          ENVEOF

      - name: Test all providers and models
        run: |
          python3 -c "
import os
from dotenv import load_dotenv
load_dotenv()
from openai import OpenAI

results = {}

# GROQ - test correct model
key = os.getenv('GROQ_API_KEY_1','')
print(f'GROQ key length: {len(key)}')
if key:
    for model in ['llama-3.3-70b-versatile','llama-3.1-70b-versatile','mixtral-8x7b-32768']:
        try:
            c = OpenAI(base_url='https://api.groq.com/openai/v1', api_key=key)
            r = c.chat.completions.create(model=model,messages=[{'role':'user','content':'Say OK'}],max_tokens=5,timeout=15)
            print(f'  GROQ {model}: OK -> {r.choices[0].message.content}')
            break
        except Exception as e:
            print(f'  GROQ {model}: FAIL -> {str(e)[:80]}')

# SAMBANOVA
key = os.getenv('SAMBANOVA_API_KEY_1','')
print(f'SAMBA key length: {len(key)}')
if key:
    for model in ['Meta-Llama-3.1-405B-Instruct','Meta-Llama-3.1-70B-Instruct','Llama-3.2-90B-Vision-Instruct']:
        try:
            c = OpenAI(base_url='https://api.sambanova.ai/v1', api_key=key)
            r = c.chat.completions.create(model=model,messages=[{'role':'user','content':'Say OK'}],max_tokens=5,timeout=15)
            print(f'  SAMBA {model}: OK -> {r.choices[0].message.content}')
            break
        except Exception as e:
            print(f'  SAMBA {model}: FAIL -> {str(e)[:80]}')

# NVIDIA
key = os.getenv('NVIDIA_API_KEY_1','')
print(f'NVIDIA key length: {len(key)}')
if key:
    for model in ['meta/llama-3.3-70b-instruct','meta/llama-3.1-70b-instruct','mistralai/mistral-7b-instruct-v0.3']:
        try:
            c = OpenAI(base_url='https://integrate.api.nvidia.com/v1', api_key=key)
            r = c.chat.completions.create(model=model,messages=[{'role':'user','content':'Say OK'}],max_tokens=5,timeout=15)
            print(f'  NVIDIA {model}: OK -> {r.choices[0].message.content}')
            break
        except Exception as e:
            print(f'  NVIDIA {model}: FAIL -> {str(e)[:80]}')

# GEMINI
key = os.getenv('GEMINI_API_KEY_1','')
print(f'GEMINI key length: {len(key)}')
if key:
    from google import genai
    for model in ['gemini-2.0-flash','gemini-1.5-flash','gemini-2.0-flash-lite']:
        try:
            c = genai.Client(api_key=key)
            r = c.models.generate_content(model=model,contents='Say OK')
            print(f'  GEMINI {model}: OK -> {r.text[:20]}')
            break
        except Exception as e:
            print(f'  GEMINI {model}: FAIL -> {str(e)[:80]}')
"
