name: Test All Keys

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install openai python-dotenv requests

      - name: Create env
        run: |
          cat > .env << ENVEOF
          SAMBANOVA_API_KEY_1=${{ secrets.SAMBANOVA_API_KEY_1 }}
          NVIDIA_API_KEY_1=${{ secrets.NVIDIA_API_KEY_1 }}
          ENVEOF

      - name: Write test script
        run: |
          cat > test_providers.py << 'PYEOF'
          import os, requests
          from dotenv import load_dotenv
          load_dotenv()

          # SAMBANOVA - list all available models
          samba_key = os.getenv("SAMBANOVA_API_KEY_1","")
          print(f"\n=== SAMBANOVA LIVE MODEL LIST (key length: {len(samba_key)}) ===")
          if samba_key:
              try:
                  r = requests.get(
                      "https://api.sambanova.ai/v1/models",
                      headers={"Authorization": f"Bearer {samba_key}"},
                      timeout=15
                  )
                  data = r.json()
                  models = [m["id"] for m in data.get("data", [])]
                  print(f"  Found {len(models)} models:")
                  for m in models:
                      print(f"    - {m}")
              except Exception as e:
                  print(f"  ERROR: {e}")

          # NVIDIA - list all available models
          nvidia_key = os.getenv("NVIDIA_API_KEY_1","")
          print(f"\n=== NVIDIA LIVE MODEL LIST (key length: {len(nvidia_key)}) ===")
          if nvidia_key:
              try:
                  r = requests.get(
                      "https://integrate.api.nvidia.com/v1/models",
                      headers={"Authorization": f"Bearer {nvidia_key}"},
                      timeout=15
                  )
                  data = r.json()
                  models = [m["id"] for m in data.get("data", [])]
                  print(f"  Found {len(models)} models:")
                  for m in sorted(models):
                      print(f"    - {m}")
              except Exception as e:
                  print(f"  ERROR: {e}")
          PYEOF

      - name: Run test
        run: python3 test_providers.py
