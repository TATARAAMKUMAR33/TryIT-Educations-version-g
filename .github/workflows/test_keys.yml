name: Test All Keys

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install openai python-dotenv requests

      - name: Create env
        run: |
          cat > .env << ENVEOF
          OPENAI_API_KEY_1=${{ secrets.OPENAI_API_KEY_1 }}
          OPENAI_API_KEY_2=${{ secrets.OPENAI_API_KEY_2 }}
          OPENAI_API_KEY_3=${{ secrets.OPENAI_API_KEY_3 }}
          ENVEOF

      - name: Check OpenAI keys
        run: |
          cat > check.py << 'PYEOF'
          import os
          from dotenv import load_dotenv
          load_dotenv()

          for i in range(1,4):
              key = os.getenv(f"OPENAI_API_KEY_{i}","")
              if not key:
                  print(f"Key {i}: NOT IN SECRETS")
                  continue

              prefix = key[:8]
              length = len(key)

              # Identify by prefix
              if key.startswith("sk-or-"):
                  source = "OpenRouter"
                  base_url = "https://openrouter.ai/api/v1"
              elif key.startswith("github_pat") or key.startswith("ghp_"):
                  source = "GitHub Models"
                  base_url = "https://models.inference.ai.azure.com"
              elif key.startswith("sk-proj") or key.startswith("sk-"):
                  source = "Real OpenAI"
                  base_url = "https://api.openai.com/v1"
              else:
                  source = "Unknown"
                  base_url = "https://api.openai.com/v1"

              print(f"Key {i}: prefix={prefix} len={length} source={source}")

              # Test it
              from openai import OpenAI
              try:
                  client = OpenAI(base_url=base_url, api_key=key)
                  if source == "GitHub Models":
                      model = "gpt-4o-mini"
                  elif source == "OpenRouter":
                      model = "openai/gpt-4o-mini"
                  else:
                      model = "gpt-4o-mini"

                  r = client.chat.completions.create(
                      model=model,
                      messages=[{"role":"user","content":"Say OK"}],
                      max_tokens=5, timeout=15
                  )
                  print(f"  RESULT: OK via {source} model={model}")
                  print(f"  REPLY: {r.choices[0].message.content}")
              except Exception as e:
                  print(f"  RESULT: FAIL - {str(e)[:100]}")
          PYEOF
          python3 check.py
