name: Test All Keys

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install openai google-genai python-dotenv

      - name: Create env
        run: |
          cat > .env << ENVEOF
          GROQ_API_KEY_1=${{ secrets.GROQ_API_KEY_1 }}
          NVIDIA_API_KEY_1=${{ secrets.NVIDIA_API_KEY_1 }}
          SAMBANOVA_API_KEY_1=${{ secrets.SAMBANOVA_API_KEY_1 }}
          GEMINI_API_KEY_1=${{ secrets.GEMINI_API_KEY_1 }}
          ENVEOF

      - name: Write test script
        run: |
          cat > test_providers.py << 'PYEOF'
          import os
          from dotenv import load_dotenv
          load_dotenv()
          from openai import OpenAI

          def test(name, base_url, key_env, models):
              key = os.getenv(key_env, '')
              print(f"\n=== {name} (key length: {len(key)}) ===")
              if not key:
                  print("  NO KEY FOUND")
                  return
              for model in models:
                  try:
                      c = OpenAI(base_url=base_url, api_key=key)
                      r = c.chat.completions.create(
                          model=model,
                          messages=[{"role":"user","content":"Say OK"}],
                          max_tokens=5, timeout=20
                      )
                      print(f"  OK: {model} -> {r.choices[0].message.content}")
                      return
                  except Exception as e:
                      print(f"  FAIL: {model} -> {str(e)[:120]}")

          test("GROQ", "https://api.groq.com/openai/v1", "GROQ_API_KEY_1",
               ["openai/gpt-oss-120b","openai/gpt-oss-20b","meta-llama/llama-4-scout-17b-16e-instruct","compound-beta"])

          test("SAMBANOVA", "https://api.sambanova.ai/v1", "SAMBANOVA_API_KEY_1",
               ["deepseek-v3-2-preview","minimax-m2-7","Meta-Llama-3.1-405B-Instruct","Llama-4-Maverick-17B-128E-Instruct"])

          test("NVIDIA", "https://integrate.api.nvidia.com/v1", "NVIDIA_API_KEY_1",
               ["meta/llama-4-scout-17b-16e-instruct","meta/llama-3.3-70b-instruct","deepseek-ai/deepseek-v3-2","nvidia/llama-3.3-nemotron-super-49b-v1.5"])

          from google import genai
          key = os.getenv("GEMINI_API_KEY_1","")
          print(f"\n=== GEMINI (key length: {len(key)}) ===")
          if key:
              for model in ["gemini-3.5-flash","gemini-3.1-flash-lite","gemini-2.5-flash","gemini-2.5-flash-lite"]:
                  try:
                      c = genai.Client(api_key=key)
                      r = c.models.generate_content(model=model, contents="Say OK")
                      print(f"  OK: {model} -> {r.text[:30]}")
                      break
                  except Exception as e:
                      print(f"  FAIL: {model} -> {str(e)[:120]}")
          PYEOF

      - name: Run test
        run: python3 test_providers.py
