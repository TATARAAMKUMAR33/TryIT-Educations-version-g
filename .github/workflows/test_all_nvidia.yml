name: Test All NVIDIA Keys
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests python-dotenv
      - name: Create .env
        run: |
          cat > .env << 'ENVEOF'
          NVIDIA_API_KEY_1=${{ secrets.NVIDIA_API_KEY_1 }}
          NVIDIA_API_KEY_2=${{ secrets.NVIDIA_API_KEY_2 }}
          NVIDIA_API_KEY_3=${{ secrets.NVIDIA_API_KEY_3 }}
          NVIDIA_API_KEY_4=${{ secrets.NVIDIA_API_KEY_4 }}
          NVIDIA_API_KEY_5=${{ secrets.NVIDIA_API_KEY_5 }}
          ENVEOF
      - name: Run Test
        run: python test_all_nvidia.py
